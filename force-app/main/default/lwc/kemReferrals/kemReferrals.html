<template>
  <template lwc:if={visible}>
    <article class="kem-card panel">
      <div class="head">
        <span class="title"
          ><lightning-icon
            icon-name="utility:groups"
            size="x-small"
          ></lightning-icon
          ><span class="kem-section-title">Referrals and alumni</span></span
        >
      </div>
      <template lwc:if={errorMessage}>
        <div
          class="slds-notify slds-notify_alert slds-alert_error"
          role="alert"
        >
          {errorMessage}
        </div>
      </template>
      <template lwc:if={isLoading}>
        <lightning-spinner
          alternative-text="Loading referrals"
          size="small"
        ></lightning-spinner>
      </template>
      <template lwc:if={desk}>
        <div class="tiles">
          <template for:each={tiles} for:item="t">
            <div key={t.key} class="tile">
              <span class="tile-value">{t.value}</span>
              <span class="tile-label">{t.label}</span>
            </div>
          </template>
        </div>
        <p class="small muted">{rewardNote}</p>

        <div class="section-title">Latest referrals</div>
        <template lwc:if={hasReferrals}>
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th scope="col">Referred</th>
                  <th scope="col">By</th>
                  <th scope="col">Status</th>
                  <th scope="col">Reward</th>
                  <th scope="col">
                    <span class="slds-assistive-text">Actions</span>
                  </th>
                </tr>
              </thead>
              <tbody>
                <template for:each={referrals} for:item="r">
                  <tr key={r.referralId}>
                    <td>{r.referred}</td>
                    <td>{r.referrer}</td>
                    <td><span class={r.badge}>{r.status}</span></td>
                    <td class="small">{r.reward}</td>
                    <td class="actions">
                      <template lwc:if={r.canReward}>
                        <lightning-button
                          variant="brand-outline"
                          label="Grant reward"
                          data-id={r.referralId}
                          onclick={handleReward}
                          disabled={isBusy}
                        ></lightning-button>
                      </template>
                      <template lwc:if={r.canDecline}>
                        <lightning-button
                          variant="base"
                          label="Not eligible"
                          data-id={r.referralId}
                          onclick={handleDecline}
                          disabled={isBusy}
                        ></lightning-button>
                      </template>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </template>
        <template lwc:else>
          <p class="small muted">
            No referrals yet. Families get their code in the portal; staff can
            add a code on an enquiry.
          </p>
        </template>

        <div class="two">
          <section>
            <div class="section-title">Top referrers</div>
            <template lwc:if={hasTopReferrers}>
              <ol class="ranking">
                <template for:each={topReferrers} for:item="r">
                  <li key={r.accountId}>
                    <span class="strong">{r.rank}. {r.name}</span>
                    <span class="small muted">{r.line} · {r.code}</span>
                  </li>
                </template>
              </ol>
            </template>
            <template lwc:else>
              <p class="small muted">Nobody yet.</p>
            </template>
          </section>
          <section>
            <div class="section-title">Alumni</div>
            <template lwc:if={hasAlumni}>
              <lightning-checkbox-group
                label="Alumni who allow contact"
                options={alumniOptions}
                value={selectedAlumni}
                onchange={handleAlumni}
              ></lightning-checkbox-group>
              <template lwc:if={noContactCount}>
                <p class="small muted">
                  {noContactCount} other alumni asked not to be contacted.
                </p>
              </template>
              <div class="invite">
                <lightning-button
                  label="Invite selected"
                  onclick={toggleInvite}
                  disabled={inviteDisabled}
                ></lightning-button>
              </div>
              <template lwc:if={showInvite}>
                <lightning-textarea
                  label="Message (their referral code is added)"
                  value={inviteText}
                  onchange={handleInviteText}
                  max-length="1000"
                ></lightning-textarea>
                <div class="invite">
                  <lightning-button
                    variant="brand"
                    label="Send invitations"
                    onclick={handleInvite}
                    disabled={inviteDisabled}
                  ></lightning-button>
                </div>
              </template>
            </template>
            <template lwc:else>
              <p class="small muted">
                Learners become alumni when they complete their last class.
              </p>
            </template>
          </section>
        </div>
      </template>
    </article>
  </template>
</template>
