<template>
  <template lwc:if={available}>
    <article class="kem-card panel">
      <div class="head">
        <lightning-icon
          icon-name="utility:einstein"
          size="x-small"
        ></lightning-icon>
        <span class="kem-section-title">Reply with Einstein</span>
      </div>
      <template lwc:if={errorMessage}>
        <div
          class="slds-notify slds-notify_alert slds-alert_error"
          role="alert"
        >
          {errorMessage}
        </div>
      </template>
      <template lwc:if={result}>
        <c-kem-ai-draft
          result={result}
          editable
          use-label="Copy and record as sent"
          busy={isBusy}
          onuse={handleUse}
          onregenerate={handleDraft}
          ondiscard={handleDiscard}
        ></c-kem-ai-draft>
      </template>
      <template lwc:else>
        <p class="kem-muted small">
          Drafts a reply from the course, prices, upcoming classes and branch
          details. You review and send it.
        </p>
        <lightning-input
          label="Anything to include? (optional)"
          value={note}
          max-length="300"
          onchange={handleNote}
        ></lightning-input>
        <div class="actions">
          <lightning-button
            variant="brand"
            label="Draft reply"
            icon-name="utility:einstein"
            onclick={handleDraft}
            disabled={isBusy}
          ></lightning-button>
        </div>
        <template lwc:if={isBusy}>
          <lightning-spinner
            alternative-text="Drafting"
            size="small"
          ></lightning-spinner>
        </template>
      </template>
    </article>
  </template>
</template>
