<template>
  <template lwc:if={visible}>
    <article class="kem-card panel" aria-label="Set-up Centre">
      <div class="head">
        <span class="title">
          <lightning-icon
            icon-name="utility:settings"
            size="x-small"
          ></lightning-icon>
          <span class="kem-section-title">Set-up Centre</span>
        </span>
        <span class="head-actions">
          <template lwc:if={centre}>
            <span class={gapBadgeClass}>{gapBadgeLabel}</span>
          </template>
          <lightning-button-icon
            icon-name="utility:refresh"
            alternative-text="Refresh"
            title="Refresh"
            variant="border-filled"
            onclick={handleRefresh}
          ></lightning-button-icon>
        </span>
      </div>

      <template lwc:if={errorMessage}>
        <div
          class="slds-notify slds-notify_alert slds-alert_error"
          role="alert"
        >
          {errorMessage}
        </div>
      </template>
      <template lwc:if={isLoading}>
        <lightning-spinner
          alternative-text="Loading the Set-up Centre"
          size="small"
        ></lightning-spinner>
      </template>

      <template lwc:if={centre}>
        <ul class="tiles" aria-label="Set-up records">
          <template for:each={tiles} for:item="t">
            <li key={t.key} class="tile" data-key={t.key}>
              <div class="tile-top">
                <lightning-icon
                  icon-name={t.icon}
                  size="small"
                  alternative-text=""
                ></lightning-icon>
                <span class="tile-label">{t.label}</span>
              </div>
              <div class="tile-count">{t.count}</div>
              <div class="tile-detail kem-muted">{t.detail}</div>
              <div class="tile-actions">
                <template lwc:if={t.canCreate}>
                  <lightning-button
                    label={t.createLabel}
                    icon-name="utility:add"
                    variant="brand-outline"
                    data-key={t.key}
                    onclick={handleCreate}
                    class="create"
                  ></lightning-button>
                </template>
                <template lwc:if={t.manageLabel}>
                  <lightning-button
                    label={t.manageLabel}
                    variant="base"
                    data-key={t.key}
                    onclick={handleManage}
                    class="manage"
                  ></lightning-button>
                </template>
                <template lwc:if={t.canList}>
                  <lightning-button
                    label="View all"
                    variant="base"
                    data-key={t.key}
                    onclick={handleList}
                    class="list"
                  ></lightning-button>
                </template>
              </div>
            </li>
          </template>
        </ul>

        <div class="gaps-head">
          <span class="kem-section-title">Set-up gaps</span>
          <span class="kem-muted small"
            >Things that stop the timetable, billing or the portal from
            working</span
          >
        </div>
        <template lwc:if={hasGaps}>
          <ul class="gaps">
            <template for:each={gapRows} for:item="g">
              <li key={g.key} class="gap" data-key={g.key}>
                <div class="gap-main">
                  <span class="kem-badge kem-badge_warning">{g.count}</span>
                  <span class="gap-label">{g.label}</span>
                </div>
                <div class="kem-muted small">{g.advice}</div>
                <div class="gap-records">
                  <template for:each={g.records} for:item="r">
                    <a
                      key={r.id}
                      href="#"
                      data-id={r.id}
                      onclick={handleOpenRecord}
                      >{r.name}</a
                    >
                  </template>
                  <template lwc:if={g.more}>
                    <span class="kem-muted small">and {g.more} more</span>
                  </template>
                </div>
              </li>
            </template>
          </ul>
        </template>
        <template lwc:else>
          <div class="kem-empty all-set">
            <lightning-icon
              icon-name="utility:success"
              size="x-small"
              variant="success"
            ></lightning-icon>
            Everything is set up: every class has a branch, teacher, room, seat
            limit and upcoming sessions.
          </div>
        </template>
      </template>
    </article>
  </template>
</template>
