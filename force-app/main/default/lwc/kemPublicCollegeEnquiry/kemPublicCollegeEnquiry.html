<template>
  <template lwc:if={isComplete}>
    <section class="card success" role="status">
      <lightning-icon
        icon-name="utility:success"
        size="large"
        variant="success"
        alternative-text="Success"
      ></lightning-icon>
      <h2>Thank you. Your admission enquiry is with our admission desk.</h2>
      <p>Reference: <strong>{reference}</strong></p>
      <p class="muted">
        {selectedBranchName} · {selectedCampusName}. The desk will call you to
        book a visit. Please bring the documents listed below.
      </p>
      <ul class="docs centered">
        <template for:each={documentRows} for:item="d">
          <li key={d.label}>
            {d.label} <span class={d.badgeClass}>{d.badge}</span>
          </li>
        </template>
      </ul>
      <button class="secondary-button" type="button" onclick={startAnother}>
        Start another enquiry
      </button>
    </section>
  </template>

  <template lwc:else>
    <section class="card" aria-busy={isBusy}>
      <ol class="steps" aria-label="Enquiry steps">
        <template for:each={stepItems} for:item="s">
          <li key={s.value} class={s.className}>
            <span class="step-number">{s.number}</span>
            <span class="step-label">{s.label}</span>
          </li>
        </template>
      </ol>

      <template lwc:if={isBusy}>
        <lightning-spinner
          alternative-text="Loading"
          size="small"
        ></lightning-spinner>
      </template>
      <template lwc:if={errorMessage}>
        <div class="error-panel" role="alert">{errorMessage}</div>
      </template>

      <!-- Step 1: campus, programme, branch -->
      <template lwc:if={isProgramme}>
        <h2 class="step-title">Where and what would you like to study?</h2>
        <p class="group-label">Campus</p>
        <div class="tiles">
          <template for:each={campusTiles} for:item="c">
            <button
              key={c.id}
              type="button"
              class={c.className}
              data-id={c.id}
              onclick={pickCampus}
            >
              <span class="tile-title">{c.name}</span>
              <span class="muted">{c.academicYear} admissions</span>
            </button>
          </template>
        </div>
        <template lwc:if={campus}>
          <p class="group-label">Programme</p>
          <div class="tiles">
            <template for:each={programmeTiles} for:item="p">
              <button
                key={p.id}
                type="button"
                class={p.className}
                data-id={p.id}
                onclick={pickProgramme}
              >
                <span class="tile-title">{p.name}</span>
                <span class="muted">{p.years} years · {p.count} branches</span>
              </button>
            </template>
          </div>
        </template>
        <template lwc:if={programme}>
          <p class="group-label">Branch</p>
          <div class="tiles wide">
            <template for:each={branchTiles} for:item="b">
              <button
                key={b.campusBranchId}
                type="button"
                class={b.className}
                data-id={b.campusBranchId}
                onclick={pickBranch}
              >
                <span class="tile-title">{b.name}</span>
                <span class="muted">Cut-off: {b.cutoff}</span>
              </button>
            </template>
          </div>
        </template>
        <template lwc:if={showRoute}>
          <p class="group-label">Joining in</p>
          <div class="tiles">
            <template for:each={routeTiles} for:item="r">
              <button
                key={r.value}
                type="button"
                class={r.className}
                data-value={r.value}
                onclick={pickRoute}
              >
                <span class="tile-title">{r.label}</span>
                <span class="muted">{r.help}</span>
              </button>
            </template>
          </div>
        </template>
      </template>

      <!-- Step 2: only the marks this branch needs, checked live -->
      <template lwc:if={isMarks}>
        <h2 class="step-title">
          Check your eligibility for {selectedBranchName}
        </h2>
        <div class="split">
          <div class="grid two-column">
            <lightning-input
              type="number"
              step="0.01"
              min="0"
              max="100"
              label="SSLC / 10th percentage"
              value={marks.sslc}
              data-field="sslc"
              onchange={handleMark}
              required
            ></lightning-input>
            <template lwc:if={needsPuc}>
              <lightning-combobox
                label="PUC stream"
                options={streamOptions}
                value={marks.stream}
                data-field="stream"
                onchange={handleMarkCombo}
                required
              ></lightning-combobox>
              <lightning-input
                type="number"
                step="0.01"
                min="0"
                max="100"
                label="PUC percentage"
                value={marks.qualifying}
                data-field="qualifying"
                onchange={handleMark}
                required
              ></lightning-input>
            </template>
            <template lwc:if={needsDiploma}>
              <lightning-combobox
                label="Diploma branch"
                options={diplomaOptions}
                value={marks.diplomaBranch}
                data-field="diplomaBranch"
                onchange={handleMarkCombo}
                required
              ></lightning-combobox>
              <lightning-input
                type="number"
                step="0.01"
                min="0"
                max="100"
                label="Diploma percentage"
                value={marks.qualifying}
                data-field="qualifying"
                onchange={handleMark}
                required
              ></lightning-input>
            </template>
            <template lwc:if={requirements.entranceRequired}>
              <lightning-combobox
                label="Entrance exam"
                options={examOptions}
                value={marks.exam}
                data-field="exam"
                onchange={handleMarkCombo}
                required
              ></lightning-combobox>
              <lightning-input
                type="number"
                min="1"
                label="Rank"
                value={marks.rank}
                data-field="rank"
                onchange={handleMark}
                required
              ></lightning-input>
            </template>
          </div>
          <aside class={verdictClass} aria-live="polite">
            <p class="verdict-title">{verdictTitle}</p>
            <template lwc:if={preview}>
              <ul class="checks">
                <template for:each={checks} for:item="c">
                  <li key={c.label} class={c.className}>
                    <lightning-icon
                      icon-name={c.icon}
                      size="x-small"
                      class="check-icon"
                      alternative-text=""
                    ></lightning-icon>
                    <span
                      ><strong>{c.label}</strong
                      ><span class="muted"> — {c.actual}</span></span
                    >
                  </li>
                </template>
              </ul>
              <template lwc:if={hasSuggestions}>
                <p class="group-label">You are eligible for</p>
                <template for:each={preview.suggestions} for:item="s">
                  <div key={s.campusBranchId} class="suggestion">
                    <span
                      >{s.branch}
                      <span class="muted">(cut-off {s.minimum}%)</span></span
                    >
                    <button
                      type="button"
                      class="link-button"
                      data-id={s.campusBranchId}
                      onclick={switchBranch}
                    >
                      Choose this
                    </button>
                  </div>
                </template>
              </template>
              <template lwc:if={notEligible}>
                <p class="muted small">
                  You can still send the enquiry — our admission desk will call
                  you about the options.
                </p>
              </template>
            </template>
            <template lwc:else>
              <p class="muted small">
                Enter your marks to see whether they meet the cut-off. This is
                only a guide; the college confirms eligibility from your
                documents.
              </p>
            </template>
          </aside>
        </div>
      </template>

      <!-- Step 3: contact details -->
      <template lwc:if={isDetails}>
        <h2 class="step-title">Your details</h2>
        <div class="grid two-column">
          <lightning-input
            label="Student first name"
            maxlength="40"
            value={form.firstName}
            data-field="firstName"
            onchange={handleField}
          ></lightning-input>
          <lightning-input
            label="Student last name"
            maxlength="80"
            value={form.lastName}
            data-field="lastName"
            onchange={handleField}
            required
          ></lightning-input>
          <lightning-input
            type="date"
            label="Date of birth"
            value={form.birthdate}
            max={today}
            data-field="birthdate"
            onchange={handleField}
          ></lightning-input>
          <lightning-input
            type="tel"
            label="Student mobile"
            maxlength="40"
            value={form.phone}
            data-field="phone"
            onchange={handleField}
          ></lightning-input>
          <lightning-input
            type="email"
            label="Student email"
            maxlength="80"
            value={form.email}
            data-field="email"
            onchange={handleField}
            class="span-two"
          ></lightning-input>
        </div>
        <p class="group-label">
          Parent or guardian <span class="muted">{parentHint}</span>
        </p>
        <div class="grid two-column">
          <lightning-input
            label="First name"
            maxlength="40"
            value={form.guardianFirstName}
            data-field="guardianFirstName"
            onchange={handleField}
          ></lightning-input>
          <lightning-input
            label="Last name"
            maxlength="80"
            value={form.guardianLastName}
            data-field="guardianLastName"
            onchange={handleField}
          ></lightning-input>
          <lightning-combobox
            label="Relationship"
            options={relationshipOptions}
            value={form.guardianRelationship}
            data-field="guardianRelationship"
            onchange={handleFieldCombo}
          ></lightning-combobox>
          <lightning-input
            type="tel"
            label="Mobile"
            maxlength="40"
            value={form.guardianPhone}
            data-field="guardianPhone"
            onchange={handleField}
          ></lightning-input>
        </div>
        <div class="honeypot" aria-hidden="true">
          <lightning-input
            label="Website"
            value={form.website}
            data-field="website"
            onchange={handleField}
            tabindex="-1"
            autocomplete="off"
          ></lightning-input>
        </div>
      </template>

      <!-- Step 4: review -->
      <template lwc:if={isReview}>
        <h2 class="step-title">Review and send</h2>
        <div class="review">
          <div class="box">
            <p class="group-label">Your choice</p>
            <p class="tile-title">{selectedBranchName}</p>
            <p>{selectedCampusName} · {routeLabel}</p>
            <p class={reviewVerdictClass}>{reviewVerdict}</p>
          </div>
          <div class="box">
            <p class="group-label">Fees for the first year</p>
            <p>Tuition {tuitionLabel} · Admission fee {admissionFeeLabel}</p>
            <p class="tile-title">Total {totalLabel}</p>
            <p class="muted small">
              Payable by demand draft, cheque or online after admission. No
              cash.
            </p>
          </div>
          <div class="box wide">
            <p class="group-label">Documents to bring</p>
            <ul class="docs">
              <template for:each={documentRows} for:item="d">
                <li key={d.label}>
                  {d.label} <span class={d.badgeClass}>{d.badge}</span>
                </li>
              </template>
            </ul>
          </div>
        </div>
        <lightning-input
          type="checkbox"
          class="consent"
          label="I consent to KT College using these details to respond to this admission enquiry."
          checked={form.privacyConsent}
          data-field="privacyConsent"
          onchange={handleField}
        ></lightning-input>
      </template>

      <div class="actions">
        <button class="secondary-button" type="button" onclick={handleBack}>
          {backLabel}
        </button>
        <template lwc:if={isReview}>
          <button
            class="primary-button"
            type="button"
            onclick={handleSubmit}
            disabled={cannotSubmit}
          >
            {submitLabel}
          </button>
        </template>
        <template lwc:else>
          <button
            class="primary-button"
            type="button"
            onclick={handleNext}
            disabled={cannotContinue}
          >
            Continue
          </button>
        </template>
      </div>
    </section>
  </template>
</template>
