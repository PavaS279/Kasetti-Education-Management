<template>
  <template lwc:if={available}>
    <article class="kem-card panel">
      <div class="head">
        <lightning-icon
          icon-name="utility:einstein"
          size="x-small"
        ></lightning-icon>
        <span class="kem-section-title">Report-card comments</span>
      </div>
      <template lwc:if={errorMessage}>
        <div
          class="slds-notify slds-notify_alert slds-alert_error"
          role="alert"
        >
          {errorMessage}
        </div>
      </template>
      <template lwc:if={hasRows}>
        <ul class="rows">
          <template for:each={rows} for:item="r">
            <li key={r.enrolmentId} class="row">
              <div class="row-head">
                <div>
                  <span class="strong">{r.learner}</span>
                  <template lwc:if={r.grade}
                    ><span class="kem-badge">{r.grade}</span></template
                  >
                </div>
                <lightning-button
                  variant="base"
                  label="Draft with Einstein"
                  data-id={r.enrolmentId}
                  onclick={handleDraft}
                  disabled={isBusy}
                ></lightning-button>
              </div>
              <template lwc:if={r.hasComment}>
                <p class="comment">{r.comment}</p>
              </template>
              <template lwc:if={r.active}>
                <template lwc:if={result}>
                  <c-kem-ai-draft
                    result={result}
                    editable
                    use-label="Save comment"
                    busy={isBusy}
                    onuse={handleUse}
                    onregenerate={draft}
                    ondiscard={handleDiscard}
                  ></c-kem-ai-draft>
                </template>
                <template lwc:elseif={isBusy}>
                  <lightning-spinner
                    alternative-text="Drafting"
                    size="small"
                  ></lightning-spinner>
                </template>
              </template>
            </li>
          </template>
        </ul>
      </template>
      <template lwc:else>
        <div class="kem-empty">No learners in this class.</div>
      </template>
    </article>
  </template>
</template>
