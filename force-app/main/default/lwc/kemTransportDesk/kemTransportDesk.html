<template>
  <template lwc:if={visible}>
    <article class="kem-card panel">
      <div class="head">
        <span class="title"
          ><lightning-icon
            icon-name="utility:travel_and_places"
            size="x-small"
          ></lightning-icon
          ><span class="kem-section-title">Transport</span></span
        >
        <template lwc:if={canSetUp}>
          <lightning-button
            label="New route"
            icon-name="utility:add"
            onclick={toggleNewRoute}
          ></lightning-button>
        </template>
      </div>
      <template lwc:if={showNewRoute}>
        <lightning-record-edit-form
          object-api-name="Transport_Route__c"
          onsuccess={handleRouteCreated}
          class="setup"
        >
          <lightning-messages></lightning-messages>
          <div class="form">
            <template lwc:if={recordId}>
              <lightning-input-field
                field-name="Branch__c"
                value={recordId}
                class="hidden-field"
              ></lightning-input-field>
            </template>
            <template lwc:else>
              <lightning-input-field
                field-name="Branch__c"
                required
              ></lightning-input-field>
            </template>
            <lightning-input-field
              field-name="Name"
              required
            ></lightning-input-field>
            <lightning-input-field
              field-name="Route_Code__c"
            ></lightning-input-field>
            <lightning-input-field
              field-name="Capacity__c"
            ></lightning-input-field>
            <lightning-input-field
              field-name="Monthly_Fee__c"
            ></lightning-input-field>
            <lightning-input-field
              field-name="Vehicle_Number__c"
            ></lightning-input-field>
            <lightning-input-field
              field-name="Driver_Name__c"
            ></lightning-input-field>
            <lightning-input-field
              field-name="Driver_Phone__c"
            ></lightning-input-field>
            <lightning-input-field
              field-name="Morning_Start__c"
            ></lightning-input-field>
            <lightning-input-field
              field-name="Afternoon_Start__c"
            ></lightning-input-field>
            <div class="form-actions">
              <lightning-button
                label="Cancel"
                onclick={toggleNewRoute}
              ></lightning-button>
              <lightning-button
                variant="brand"
                type="submit"
                label="Create route"
              ></lightning-button>
            </div>
          </div>
        </lightning-record-edit-form>
      </template>
      <template lwc:if={errorMessage}>
        <div
          class="slds-notify slds-notify_alert slds-alert_error"
          role="alert"
        >
          {errorMessage}
        </div>
      </template>
      <template lwc:if={isLoading}>
        <lightning-spinner
          alternative-text="Loading routes"
          size="small"
        ></lightning-spinner>
      </template>
      <template lwc:if={routes}>
        <template lwc:if={hasRoutes}>
          <div class="layout">
            <ul class="routes" aria-label="Routes">
              <template for:each={routeCards} for:item="r">
                <li key={r.routeId}>
                  <button
                    type="button"
                    class={r.className}
                    data-id={r.routeId}
                    onclick={handleRoute}
                  >
                    <span class="route-name">{r.name}</span>
                    <span class="small muted">{r.meta}</span>
                    <span class="bar"
                      ><span class={r.barClass} style={r.barStyle}></span
                    ></span>
                    <span class="small">{r.seats} · {r.fee}</span>
                  </button>
                </li>
              </template>
            </ul>
            <template lwc:if={route}>
              <section class="detail">
                <div class="detail-head">
                  <div>
                    <div class="route-title">{route.name}</div>
                    <div class="small muted">
                      {route.vehicle} · driver {route.driver}
                      {route.driverPhone} · morning {route.morningStart} ·
                      afternoon {route.afternoonStart}
                    </div>
                  </div>
                  <div class="actions">
                    <template lwc:if={canSetUp}>
                      <lightning-button
                        label="Add stop"
                        icon-name="utility:location"
                        onclick={toggleNewStop}
                      ></lightning-button>
                    </template>
                    <template lwc:if={canManage}>
                      <lightning-button
                        label="Add learner"
                        icon-name="utility:add"
                        onclick={toggleAssign}
                      ></lightning-button>
                      <lightning-button
                        label="Message families"
                        icon-name="utility:email"
                        onclick={toggleNotice}
                      ></lightning-button>
                    </template>
                    <lightning-button-icon
                      icon-name="utility:print"
                      alternative-text="Print manifest"
                      title="Print manifest"
                      onclick={handlePrint}
                    ></lightning-button-icon>
                  </div>
                </div>

                <template lwc:if={showNewStop}>
                  <lightning-record-edit-form
                    object-api-name="Transport_Stop__c"
                    onsuccess={handleStopCreated}
                  >
                    <lightning-messages></lightning-messages>
                    <div class="form">
                      <lightning-input-field
                        field-name="Route__c"
                        value={selectedRouteId}
                        class="hidden-field"
                      ></lightning-input-field>
                      <lightning-input-field
                        field-name="Name"
                        required
                      ></lightning-input-field>
                      <lightning-input-field
                        field-name="Sequence__c"
                        value={nextSequence}
                      ></lightning-input-field>
                      <lightning-input-field
                        field-name="Pickup_Time__c"
                      ></lightning-input-field>
                      <lightning-input-field
                        field-name="Drop_Time__c"
                      ></lightning-input-field>
                      <lightning-input-field
                        field-name="Landmark__c"
                      ></lightning-input-field>
                      <div class="form-actions">
                        <lightning-button
                          label="Cancel"
                          onclick={toggleNewStop}
                        ></lightning-button>
                        <lightning-button
                          variant="brand"
                          type="submit"
                          label="Add stop"
                        ></lightning-button>
                      </div>
                    </div>
                  </lightning-record-edit-form>
                </template>

                <template lwc:if={showAssign}>
                  <div class="form">
                    <lightning-input
                      type="search"
                      label="Learner (enrolled at this branch)"
                      value={searchTerm}
                      onchange={handleSearch}
                      placeholder="Type at least two letters"
                    ></lightning-input>
                    <template lwc:if={hasLearnerOptions}>
                      <lightning-combobox
                        label="Choose learner"
                        options={learnerOptions}
                        value={learnerId}
                        data-field="learnerId"
                        onchange={handleField}
                      ></lightning-combobox>
                    </template>
                    <lightning-combobox
                      label="Stop"
                      options={stopOptions}
                      value={stopId}
                      data-field="stopId"
                      onchange={handleField}
                    ></lightning-combobox>
                    <lightning-combobox
                      label="Direction"
                      options={directions}
                      value={direction}
                      data-field="direction"
                      onchange={handleField}
                    ></lightning-combobox>
                    <lightning-input
                      type="date"
                      label="Start date"
                      value={startDate}
                      data-field="startDate"
                      onchange={handleField}
                    ></lightning-input>
                    <lightning-input
                      type="checkbox"
                      label="Charge the monthly transport fee (billed with the learner's class)"
                      checked={chargeFee}
                      data-field="chargeFee"
                      onchange={handleField}
                    ></lightning-input>
                    <div class="form-actions">
                      <lightning-button
                        label="Cancel"
                        onclick={toggleAssign}
                      ></lightning-button>
                      <lightning-button
                        variant="brand"
                        label="Add to route"
                        onclick={handleAssign}
                        disabled={assignDisabled}
                      ></lightning-button>
                    </div>
                  </div>
                </template>

                <template lwc:if={showNotice}>
                  <div class="form">
                    <lightning-textarea
                      label="Message to every family on this route"
                      value={notice}
                      onchange={handleNoticeText}
                      max-length="1000"
                      placeholder="For example: The bus is running 20 minutes late this morning."
                    ></lightning-textarea>
                    <div class="form-actions">
                      <lightning-button
                        label="Cancel"
                        onclick={toggleNotice}
                      ></lightning-button>
                      <lightning-button
                        variant="brand"
                        label="Send"
                        onclick={handleSendNotice}
                        disabled={noticeDisabled}
                      ></lightning-button>
                    </div>
                  </div>
                </template>

                <p class="small muted">{riderCount} learner(s) on this route</p>
                <ol class="stops">
                  <template for:each={stops} for:item="s">
                    <li key={s.stopId} class="stop">
                      <div class="stop-head">
                        <span class="stop-name">{s.sequence}. {s.name}</span>
                        <span class="small muted">{s.times}</span>
                      </div>
                      <template lwc:if={s.landmark}>
                        <div class="small muted">{s.landmark}</div>
                      </template>
                      <template lwc:if={s.hasRiders}>
                        <ul class="riders">
                          <template for:each={s.riders} for:item="r">
                            <li key={r.assignmentId} class="rider">
                              <span class="rider-name">
                                <span>{r.learner}</span>
                                <span class="small muted"
                                  >{r.direction} · {r.contact}</span
                                >
                              </span>
                              <template lwc:if={canManage}>
                                <span class="rider-actions">
                                  <lightning-combobox
                                    class="stop-pick"
                                    label="Stop"
                                    variant="label-hidden"
                                    options={r.stopOptions}
                                    value={r.stopId}
                                    data-id={r.assignmentId}
                                    onchange={handleChangeStop}
                                  ></lightning-combobox>
                                  <lightning-button-icon
                                    icon-name="utility:close"
                                    alternative-text="End transport"
                                    title="End transport"
                                    data-id={r.assignmentId}
                                    onclick={handleEnd}
                                  ></lightning-button-icon>
                                </span>
                              </template>
                            </li>
                          </template>
                        </ul>
                      </template>
                    </li>
                  </template>
                </ol>
              </section>
            </template>
          </div>
        </template>
        <template lwc:else>
          <p class="small muted">
            No routes yet. Use New route, then add its stops.
          </p>
        </template>
      </template>
    </article>
  </template>
</template>
