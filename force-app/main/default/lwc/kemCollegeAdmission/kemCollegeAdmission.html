<template>
  <section class="kem-card panel">
    <template lwc:if={errorMessage}>
      <div class="slds-notify slds-notify_alert slds-alert_error" role="alert">
        {errorMessage}
      </div>
    </template>
    <template lwc:if={admission}>
      <header>
        <div>
          <p class="eyebrow">COLLEGE ADMISSION · {admission.stage}</p>
          <h2>{admission.student}</h2>
          <p class="subtitle">
            {admission.branch} · {admission.campus} · {admission.entryRoute}
            entry
          </p>
        </div>
        <span class={verdictClass}>{admission.eligibility}</span>
      </header>
      <p class="notes">{admission.eligibilityNotes}</p>
      <template lwc:if={hasSuggestions}>
        <div class="suggestions">
          <strong>Eligible instead for:</strong>
          <ul>
            <template for:each={admission.suggestions} for:item="s">
              <li key={s}>{s}</li>
            </template>
          </ul>
        </div>
      </template>

      <template lwc:if={admission.programmeEnrolmentId}>
        <div class="enrolled">
          Programme enrolment {admission.enrolmentStatus} · roll number
          {rollLabel}
          <lightning-button
            variant="base"
            label="Open programme enrolment"
            onclick={openEnrolment}
          ></lightning-button>
        </div>
      </template>
      <template lwc:if={admission.decision}>
        <div class="decided">
          Decision: {admission.decision} — {admission.decisionReason}
        </div>
      </template>

      <h3>1 · Admission desk</h3>
      <div class="row">
        <template lwc:if={admission.consent}>
          <span class="ok">Privacy consent recorded</span>
        </template>
        <template lwc:elseif={admission.canDesk}>
          <lightning-button
            label="Record privacy consent"
            onclick={handleConsent}
          ></lightning-button>
        </template>
      </div>
      <table class="slds-table slds-table_bordered slds-table_cell-buffer">
        <thead>
          <tr>
            <th scope="col">Document</th>
            <th scope="col">Status</th>
            <th scope="col">Verify</th>
          </tr>
        </thead>
        <tbody>
          <template for:each={items} for:item="i">
            <tr key={i.id}>
              <td>
                <a href="#" data-id={i.id} onclick={openItem}>{i.name}</a>
                <template lwc:if={i.optional}
                  ><span class="small"> (optional)</span></template
                >
              </td>
              <td>{i.statusLabel}</td>
              <td>
                <template lwc:if={i.canVerify}>
                  <div class="verify">
                    <template lwc:if={i.identity}>
                      <lightning-input
                        label="Last 4 digits"
                        variant="label-hidden"
                        placeholder="Last 4 digits"
                        max-length="4"
                        data-id={i.id}
                      ></lightning-input>
                    </template>
                    <lightning-button
                      label="Verify"
                      data-id={i.id}
                      onclick={handleVerify}
                    ></lightning-button>
                  </div>
                </template>
              </td>
            </tr>
          </template>
        </tbody>
      </table>
      <template lwc:if={canMarkVerified}>
        <lightning-button
          class="space"
          variant="brand"
          label="Mark documents verified"
          onclick={handleMarkVerified}
        ></lightning-button>
      </template>

      <template lwc:if={admission.canDean}>
        <h3>2 · Dean</h3>
        <template lwc:if={showSchedule}>
          <div class="row">
            <lightning-input
              type="datetime"
              label="Interview date and time"
              value={interviewAt}
              onchange={handleInterviewAt}
            ></lightning-input>
            <lightning-button
              label="Schedule interview"
              onclick={handleSchedule}
            ></lightning-button>
          </div>
        </template>
        <template lwc:if={showOutcome}>
          <p class="small">
            Interview with {admission.interviewer} on {admission.interviewAt}
          </p>
          <div class="row">
            <lightning-combobox
              label="Outcome"
              options={outcomeOptions}
              value={outcome}
              onchange={handleOutcome}
            ></lightning-combobox>
            <lightning-input
              label="Remarks"
              value={remarks}
              onchange={handleRemarks}
            ></lightning-input>
            <lightning-button
              label="Record outcome"
              onclick={handleRecordOutcome}
            ></lightning-button>
          </div>
        </template>
        <template lwc:if={showDecision}>
          <div class="row">
            <template lwc:if={canAdmit}>
              <lightning-button
                variant="brand"
                label="Admit"
                onclick={handleAdmit}
              ></lightning-button>
            </template>
            <lightning-input
              label="Reason for rejecting"
              value={rejectReason}
              onchange={handleRejectReason}
            ></lightning-input>
            <lightning-button
              variant="destructive-text"
              label="Reject"
              onclick={handleReject}
            ></lightning-button>
          </div>
        </template>
      </template>
    </template>
  </section>
</template>
