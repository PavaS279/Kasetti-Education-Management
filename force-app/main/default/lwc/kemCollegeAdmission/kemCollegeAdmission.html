<template>
  <section class="kem-card panel">
    <template lwc:if={errorMessage}>
      <div class="slds-notify slds-notify_alert slds-alert_error" role="alert">
        {errorMessage}
      </div>
    </template>
    <template lwc:if={admission}>
      <header>
        <div>
          <p class="eyebrow">COLLEGE ADMISSION · {admission.stage}</p>
          <h2>{admission.student}</h2>
          <p class="subtitle">
            {admission.branch} · {admission.campus} · {admission.entryRoute}
            entry
          </p>
        </div>
        <span class={verdictClass}>{admission.eligibility}</span>
      </header>
      <p class="notes">{admission.eligibilityNotes}</p>
      <template lwc:if={hasQuotas}>
        <div class="quota-line">
          <span class="small">Quota: <strong>{quotaLabel}</strong></span>
          <template lwc:if={admission.canChangeQuota}>
            <lightning-combobox
              class="quota-pick"
              label="Change quota"
              variant="label-hidden"
              options={quotaOptions}
              value={quotaValue}
              onchange={handleQuotaChoice}
            ></lightning-combobox>
            <lightning-button
              label="Save quota"
              onclick={handleSaveQuota}
            ></lightning-button>
          </template>
        </div>
      </template>
      <template lwc:if={hasSuggestions}>
        <div class="suggestions">
          <strong>Eligible instead for:</strong>
          <ul>
            <template for:each={admission.suggestions} for:item="s">
              <li key={s}>{s}</li>
            </template>
          </ul>
        </div>
      </template>

      <template lwc:if={admission.programmeEnrolmentId}>
        <div class="enrolled">
          Programme enrolment {admission.enrolmentStatus} · enrolment number
          {rollLabel}
          <lightning-button
            variant="base"
            label="Open programme enrolment"
            onclick={openEnrolment}
          ></lightning-button>
        </div>
      </template>
      <template lwc:if={showSectionPrompt}>
        <div class="next-step" role="status">
          <strong>Next: allot a section.</strong>
          The fee is received and the enrolment number is issued. Choose the
          student's section and joining date on the programme enrolment.
          <lightning-button
            class="slds-m-left_x-small"
            variant="brand"
            label="Allot section"
            onclick={openEnrolment}
          ></lightning-button>
        </div>
      </template>
      <template lwc:if={showPortal}>
        <div class="portal" role="status">
          <strong>Student portal: {admission.portal.label}</strong>
          <span class="small">{portalHint}</span>
          <template lwc:if={admission.portal.canGive}>
            <lightning-button
              class="slds-m-left_x-small"
              label="Give portal access"
              icon-name="utility:email"
              onclick={handleGivePortal}
            ></lightning-button>
          </template>
          <template lwc:if={admission.portal.canResend}>
            <lightning-button
              class="slds-m-left_x-small"
              label="Send password link"
              icon-name="utility:email"
              onclick={handleSendLink}
            ></lightning-button>
          </template>
        </div>
      </template>
      <template lwc:if={admission.decision}>
        <div class="decided">
          Decision: {admission.decision} — {admission.decisionReason}
        </div>
      </template>

      <h3>1 · Admission desk</h3>
      <div class="row">
        <template lwc:if={admission.consent}>
          <span class="ok">Privacy consent recorded</span>
        </template>
        <template lwc:elseif={admission.canDesk}>
          <lightning-button
            label="Record privacy consent"
            onclick={handleConsent}
          ></lightning-button>
        </template>
      </div>
      <table class="slds-table slds-table_bordered slds-table_cell-buffer">
        <thead>
          <tr>
            <th scope="col">Document</th>
            <th scope="col">Status</th>
            <th scope="col">Verify</th>
          </tr>
        </thead>
        <tbody>
          <template for:each={items} for:item="i">
            <tr key={i.id}>
              <td>
                <a href="#" data-id={i.id} onclick={openItem}>{i.name}</a>
                <template lwc:if={i.optional}
                  ><span class="small"> (optional)</span></template
                >
              </td>
              <td>{i.statusLabel}</td>
              <td>
                <template lwc:if={i.canVerify}>
                  <div class="verify">
                    <template lwc:if={i.identity}>
                      <lightning-input
                        label="Last 4 digits"
                        variant="label-hidden"
                        placeholder="Last 4 digits"
                        max-length="4"
                        data-id={i.id}
                      ></lightning-input>
                    </template>
                    <lightning-button
                      label="Verify"
                      data-id={i.id}
                      onclick={handleVerify}
                    ></lightning-button>
                  </div>
                </template>
              </td>
            </tr>
          </template>
        </tbody>
      </table>
      <template lwc:if={canMarkVerified}>
        <lightning-button
          class="space"
          variant="brand"
          label="Mark documents verified"
          onclick={handleMarkVerified}
        ></lightning-button>
      </template>

      <template lwc:if={showDeskDecision}>
        <h3>2 · Decision</h3>
        <template lwc:if={admission.admissible}>
          <p class="small">{admitHint}</p>
          <div class="row">
            <lightning-button
              variant="brand"
              label="Admit"
              onclick={handleAdmit}
            ></lightning-button>
          </div>
        </template>
        <template lwc:if={admission.needsException}>
          <p class="small">
            This applicant does not meet the criteria. Ask the Dean for an
            exception with a reason, or close the admission.
          </p>
          <div class="row">
            <lightning-textarea
              class="exception-reason"
              label="Reason for the Dean"
              value={exceptionReason}
              onchange={handleExceptionReason}
            ></lightning-textarea>
            <lightning-button
              variant="brand"
              label="Request Dean approval"
              onclick={handleRequestException}
            ></lightning-button>
          </div>
        </template>
        <div class="row">
          <lightning-input
            label="Reason for not admitting"
            value={rejectReason}
            onchange={handleRejectReason}
          ></lightning-input>
          <lightning-button
            variant="destructive-text"
            label="Not admitted"
            onclick={handleReject}
          ></lightning-button>
        </div>
      </template>

      <template lwc:if={hasException}>
        <div class={exceptionClass}>
          <strong>Dean exception: {admission.exceptionStatus}</strong>
          <p class="small">
            Requested by {admission.exceptionRequestedBy}:
            {admission.exceptionReason}
          </p>
          <template lwc:if={admission.exceptionRemarks}>
            <p class="small">
              {admission.exceptionDecidedBy}: {admission.exceptionRemarks}
            </p>
          </template>
        </div>
      </template>

      <template lwc:if={showDean}>
        <h3>Dean · exception request</h3>
        <template lwc:if={showSchedule}>
          <div class="row">
            <lightning-input
              type="datetime"
              label="Interview (optional)"
              value={interviewAt}
              onchange={handleInterviewAt}
            ></lightning-input>
            <lightning-button
              label="Schedule interview"
              onclick={handleSchedule}
            ></lightning-button>
          </div>
        </template>
        <template lwc:if={showOutcome}>
          <p class="small">
            Interview with {admission.interviewer} on {admission.interviewAt}
          </p>
          <div class="row">
            <lightning-combobox
              label="Outcome"
              options={outcomeOptions}
              value={outcome}
              onchange={handleOutcome}
            ></lightning-combobox>
            <lightning-input
              label="Remarks"
              value={remarks}
              onchange={handleRemarks}
            ></lightning-input>
            <lightning-button
              label="Record outcome"
              onclick={handleRecordOutcome}
            ></lightning-button>
          </div>
        </template>
        <template lwc:if={showExceptionDecision}>
          <div class="row">
            <lightning-input
              label="Dean's remarks"
              value={deanRemarks}
              onchange={handleDeanRemarks}
            ></lightning-input>
            <lightning-button
              variant="brand"
              label="Approve exception"
              onclick={handleApproveException}
            ></lightning-button>
            <lightning-button
              variant="destructive-text"
              label="Decline"
              onclick={handleDeclineException}
            ></lightning-button>
          </div>
        </template>
        <template lwc:if={showLegacyDecision}>
          <div class="row">
            <lightning-button
              variant="brand"
              label="Admit"
              onclick={handleAdmit}
            ></lightning-button>
            <lightning-input
              label="Reason for rejecting"
              value={rejectReason}
              onchange={handleRejectReason}
            ></lightning-input>
            <lightning-button
              variant="destructive-text"
              label="Reject"
              onclick={handleReject}
            ></lightning-button>
          </div>
        </template>
      </template>
    </template>
  </section>
</template>
