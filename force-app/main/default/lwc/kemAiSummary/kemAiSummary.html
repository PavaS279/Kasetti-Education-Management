<template>
  <template lwc:if={available}>
    <article class="kem-card panel">
      <div class="head">
        <span class="title"
          ><lightning-icon
            icon-name="utility:einstein"
            size="x-small"
          ></lightning-icon
          ><span class="kem-section-title">Einstein summary</span></span
        >
        <lightning-button-icon
          icon-name="utility:refresh"
          alternative-text="Summarise"
          title="Summarise"
          onclick={handleSummarise}
          disabled={isBusy}
        ></lightning-button-icon>
      </div>
      <template lwc:if={errorMessage}>
        <div
          class="slds-notify slds-notify_alert slds-alert_error"
          role="alert"
        >
          {errorMessage}
        </div>
      </template>
      <template lwc:if={isBusy}>
        <lightning-spinner
          alternative-text="Summarising"
          size="small"
        ></lightning-spinner>
      </template>
      <template lwc:if={result}>
        <ul class="bullets">
          <template for:each={lines} for:item="l">
            <li key={l.key}>{l.text}</li>
          </template>
        </ul>
        <div class="meta">
          <span>{footer}</span>
          <template lwc:if={reviewed}>
            <span>Thanks for the feedback</span>
          </template>
          <template lwc:else>
            <span class="feedback">
              <lightning-button-icon
                icon-name="utility:like"
                alternative-text="Helpful"
                title="Helpful"
                data-helpful="true"
                onclick={handleFeedback}
                size="small"
              ></lightning-button-icon>
              <lightning-button-icon
                icon-name="utility:dislike"
                alternative-text="Not helpful"
                title="Not helpful"
                data-helpful="false"
                onclick={handleFeedback}
                size="small"
              ></lightning-button-icon>
            </span>
          </template>
        </div>
      </template>
      <template lwc:elseif={isBusy}></template>
      <template lwc:else>
        <lightning-button
          label="Summarise"
          icon-name="utility:einstein"
          onclick={handleSummarise}
        ></lightning-button>
      </template>
    </article>
  </template>
</template>
