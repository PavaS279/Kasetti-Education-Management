<template>
  <lightning-modal-header label="New enquiry">
    <p class="tagline">
      Who is the learner, who is the parent or guardian, and what are they
      interested in?
    </p>
  </lightning-modal-header>
  <lightning-modal-body>
    <lightning-record-edit-form
      lwc:ref="form"
      object-api-name="Lead"
      onsubmit={handleSubmit}
      onsuccess={handleSuccess}
      onerror={handleError}
    >
      <template lwc:if={errorMessage}>
        <div
          class="slds-notify slds-notify_alert slds-alert_error"
          role="alert"
        >
          {errorMessage}
        </div>
      </template>

      <div class="section-title">Learner</div>
      <div class="form-grid">
        <lightning-input-field field-name="FirstName"></lightning-input-field>
        <lightning-input-field
          field-name="LastName"
          required
        ></lightning-input-field>
        <lightning-input-field
          field-name="Learner_Birthdate__c"
        ></lightning-input-field>
        <lightning-input-field field-name="MobilePhone"></lightning-input-field>
        <lightning-input-field
          class="span-all"
          field-name="Email"
        ></lightning-input-field>
      </div>

      <div class="section-title">Parent or guardian</div>
      <div class="form-grid">
        <lightning-input-field
          field-name="Guardian_First_Name__c"
        ></lightning-input-field>
        <lightning-input-field
          field-name="Guardian_Last_Name__c"
        ></lightning-input-field>
        <lightning-input-field
          field-name="Guardian_Relationship__c"
        ></lightning-input-field>
        <lightning-input-field
          field-name="Guardian_Phone__c"
        ></lightning-input-field>
        <lightning-input-field
          class="span-all"
          field-name="Guardian_Email__c"
        ></lightning-input-field>
      </div>

      <div class="section-title">Interest</div>
      <div class="form-grid">
        <lightning-input-field
          field-name="Branch__c"
          value={branchId}
          required
        ></lightning-input-field>
        <lightning-input-field
          field-name="Interested_Course__c"
        ></lightning-input-field>
        <lightning-input-field
          field-name="Enquiry_Channel__c"
        ></lightning-input-field>
        <lightning-input-field
          field-name="Referral_Code__c"
          class="referral"
        ></lightning-input-field>
        <lightning-input-field
          field-name="Preferred_Delivery_Mode__c"
        ></lightning-input-field>
        <lightning-input-field
          field-name="Next_Follow_Up__c"
        ></lightning-input-field>
        <lightning-input-field
          field-name="Trial_Session_Date__c"
        ></lightning-input-field>
        <lightning-input-field
          class="span-all"
          field-name="Description"
        ></lightning-input-field>
      </div>
      <button lwc:ref="submit" type="submit" class="slds-hide">Save</button>
    </lightning-record-edit-form>
  </lightning-modal-body>
  <lightning-modal-footer>
    <lightning-button label="Cancel" onclick={handleCancel}></lightning-button>
    <lightning-button
      class="slds-m-left_x-small"
      variant="brand"
      label="Save enquiry"
      onclick={handleSave}
      disabled={isSaving}
    ></lightning-button>
  </lightning-modal-footer>
</template>
